name: Assignment CI

on:
  push:
    branches: [task-dao-governance]
  pull_request:
    branches: [task-dao-governance]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:assignment
